[workspace]
name = "event-details-categorical"
channels = [
  'https://repo.prefix.dev/ecoscope-workflows/',
  'https://repo.prefix.dev/ecoscope-workflows-custom/',
  'conda-forge',
]
platforms = ['linux-64', 'osx-arm64', 'osx-64', 'win-64']

[dependencies]
wt-compiler = "==0.10.2"
python = "3.14.*"
graphviz = "*"

[tasks.compile-event-details-categorical]
cmd = './dev/recompile.sh --install'

[tasks.recompile-event-details-categorical]
cmd = './dev/recompile.sh --update'
