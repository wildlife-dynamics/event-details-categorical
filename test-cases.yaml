wd-bird-point-count:
  name: WD bird point counts, one record per detection
  description: >-
    Repeating group (own mock data in mock-io/wd-bird-point-count/: real WD counts, reporter
    names replaced): 162 detections from 11 counts, main field Detection: Species, group
    fields in form order, an event-level field (Station), a cross-tab inside the group.
  params:
    workflow_details:
      name: Bird Point Counts - Species
      description: ""
    er_client:
      data_source:
        name: wd
    time_range:
      since: "2026-09-01T00:00:00.000Z"
      until: "2026-10-22T00:00:00.000Z"
      timezone: {label: "UTC+03:00", tzCode: Africa/Nairobi, name: Africa/Nairobi, utc: "+03:00"}
    fields:
      event_type: bird_point_count
      main_field: "Detection: Species"
      other_fields: ["Detection: Distance band", "Detection: Time interval", "Detection: Detection type", Station]
      cross_tabs:
        - {rows: "Detection: Species", columns: "Detection: Distance band"}
      sunburst_fields: []
      natural_order_fields: ["Detection: Distance band", "Detection: Time interval"]
      show_full_list: false
    groupers:
      groupers: []
    base_maps: {}
    trend_period: {period: auto}
    grid: {}

