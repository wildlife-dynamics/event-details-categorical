id: categorical
metadata:
  name: Event Details - Categorical Field Workflow
  description: >-
    Summarises one dropdown field of an EarthRanger event type, such as species, cause of death
    or water level: which values were recorded, how often, when and where. One event type per
    run (v2 forms). Supports follow-up questions, repeating lists (e.g. one row per species
    seen) and an optional number field to total per value (e.g. birds counted).
  maintainers:
    - name: Zakariya Husayn
      email: zakariya@wildlifedynamics.com
      role: owner
  outputs:
    - name: Categorical Field Dashboard
      type: dashboard
      description: >-
        Headline tiles, a bar chart and breakdown sunburst of the field's values, the values
        over time, a points map, a grid density map and a values table.
      indicators:
        - name: Event field values
    - name: Values and events tables
      type: file
      description: >-
        values_summary.csv (every value with its count and share) and events.csv (one row per
        event with the field and its follow-up answers; no reporter names).
      indicators:
        - name: Event field values
  license: BSD-3-Clause
  repository: https://github.com/wildlife-dynamics/event-details-categorical
  documentation: https://github.com/wildlife-dynamics/event-details-categorical#readme
  readme: README.md
  keywords: [event-details, categorical, earthranger, species, dropdown]
  thumbnail: resources/thumbnail.png

requirements:
  - name: ecoscope-platform
    version: ">=2.23.0,<3.0.0"
    channel: https://repo.prefix.dev/ecoscope-workflows/

  - name: ecoscope-workflows-ext-custom
    version: "0.1.2"
    channel: https://repo.prefix.dev/ecoscope-workflows-custom/

  # ecoscope-platform already requires pydeck==0.9.2, which is only on conda-forge;
  # pinned here so strict channel priority can resolve it (as in event-details).
  - name: pydeck
    version: 0.9.2
    channel: conda-forge

  # wd-partner-tasks: src/ecoscope-workflows-ext-wd (categorical tasks: _categorical.py).
  - name: ecoscope-workflows-ext-wd
    version: "0.0.16"
    channel: https://repo.prefix.dev/ecoscope-workflows-custom/

rjsf-overrides:
  properties:
    time_range.description: Choose the period. Events created in this period are included.

    # Event type: a dropdown of the site's event types.
    fields.properties.event_type.ecoscope:transform:
      - transformer: EarthRangerEnumResolver
        transformer_kws:
          type: event_type
          depends_on: properties.er_client.properties.data_source.properties.name

    # Field dropdowns: the selected event type's choice and number fields. include_nested
    # also lists fields in repeating groups (Detection: Species), follow-up questions and
    # yes/no fields; it needs ecoscope-server with include_nested (compose #3343).
    fields.properties.main_field.ecoscope:transform:
      - transformer: EarthRangerEnumResolver
        transformer_kws:
          type: event_type_schema_choice_prop
          depends_on: properties.fields.properties.event_type
          include_nested: true
    fields.properties.count_field.ecoscope:transform:
      - transformer: EarthRangerEnumResolver
        transformer_kws:
          type: event_type_schema_numeric_prop
          depends_on: properties.fields.properties.event_type
          include_nested: true

    # Advanced field titles and help text (the task's own text is more technical).
    fields.properties.count_field.title: Count Field
    fields.properties.count_field.description: >-
      A number field to total for each value, e.g. Count, so the charts show animals counted
      rather than records. Leave empty to count records.
    fields.properties.split_write_ins.title: Show Typed "Other" Names
    fields.properties.split_write_ins.description: >-
      Show each name typed for an "Other" answer as its own value, e.g. "Other: Flappet
      Lark", instead of one "Other". Names are kept as typed.
    fields.properties.keep_form_order.description: >-
      Show the values in the order they appear on the form instead of by count, e.g. for age
      class or water level.
    fields.properties.show_full_list.description: >-
      Show every value in the outputs instead of the 10 most common plus "Other".

    # Group by: time or reporter only (no spatial regions, no quarter)
    groupers.properties.groupers.description: >-
      Choose how to split the outputs into views, e.g. by year or reporter (optional).
      Leave empty for one view of all events.
    groupers.properties.groupers.items.anyOf:
      - $ref: "#/$defs/TemporalGrouper"
      - $ref: "#/$defs/ValueGrouper"

    base_maps.properties.base_maps.description: >-
      Select tile layers to use as base layers in map outputs. The first layer in the
      list will be the bottommost layer displayed.

  $defs:
    ValueGrouper.properties.index_name.oneOf:
      - const: reported_by_name
        title: Reported By

  uiSchema:
    groupers.groupers.items.anyOf:
      - ui:options:
          label: false
      - ui:options:
          label: false
    base_maps.base_maps.items.ui:options.label: false

task-instance-defaults:
  skipif:
    conditions:
      - any_is_empty_df
      - any_dependency_skipped

workflow:
  - name: Workflow Details
    id: workflow_details
    task: set_workflow_details

  - name: Data Source
    id: er_client
    task: set_er_connection

  - name: Time Range
    id: time_range
    task: set_time_range
    partial:
      time_format: "%d %b %Y %H:%M:%S %Z"

  - id: get_timezone
    task: get_timezone_from_time_range
    partial:
      time_range: ${{ workflow.time_range.return }}

  - name: Event Type and Fields
    id: fields
    task: set_categorical_fields

  - name: Group by
    id: groupers
    task: set_groupers

  - name: Base Maps
    id: base_maps
    task: set_base_maps

  # ── data ──────────────────────────────────────────────────────────────────────

  - id: catalogue
    task: get_categorical_field_catalogue
    partial:
      client: ${{ workflow.er_client.return }}
      fields: ${{ workflow.fields.return }}

  - id: events
    task: get_categorical_events
    partial:
      client: ${{ workflow.er_client.return }}
      time_range: ${{ workflow.time_range.return }}
      catalogue: ${{ workflow.catalogue.return }}

  - id: events_local_time
    task: convert_values_to_timezone
    partial:
      df: ${{ workflow.events.return }}
      timezone: ${{ workflow.get_timezone.return }}
      columns:
        - time

  - id: events_temporal_index
    task: add_temporal_index
    partial:
      df: ${{ workflow.events_local_time.return }}
      time_col: time
      groupers: ${{ workflow.groupers.return }}
      cast_to_datetime: true
      format: mixed

  # ranking, colours and grid size come from the whole run, before grouping, so a value
  # keeps its colour (and Other holds the same values) in every view
  - id: ranking
    task: rank_categorical_values
    partial:
      df: ${{ workflow.events_temporal_index.return }}
      catalogue: ${{ workflow.catalogue.return }}

  - id: events_split
    task: split_groups
    partial:
      df: ${{ workflow.events_temporal_index.return }}
      groupers: ${{ workflow.groupers.return }}

  # ── 4 over time ───────────────────────────────────────────────────────────────
  # (before the headline tiles, which use the trend period)

  - title: Time Period
    type: task-group
    description: The period each bar covers in the chart over time and the tiles' trend lines.
    tasks:
      - id: trend_period
        task: set_categorical_trend_period

      - id: main_over_time_title
        task: categorical_widget_title
        partial:
          catalogue: ${{ workflow.catalogue.return }}
          template: "{main} over time"

      - id: trends_main
        task: draw_categorical_trends
        partial:
            catalogue: ${{ workflow.catalogue.return }}
            ranking: ${{ workflow.ranking.return }}
            period: ${{ workflow.trend_period.return }}
            which: main
        mapvalues:
          argnames: df
          argvalues: ${{ workflow.events_split.return }}

      - id: trends_main_html
        task: persist_text
        partial:
          root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
          filename_suffix: main_field_over_time
        mapvalues:
          argnames: text
          argvalues: ${{ workflow.trends_main.return }}

      - id: trends_main_widget
        task: create_plot_widget_single_view
        skipif:
          conditions:
            - never
        partial:
          title: ${{ workflow.main_over_time_title.return }}
        map:
          argnames: [view, data]
          argvalues: ${{ workflow.trends_main_html.return }}

      - id: trends_main_merged
        task: merge_widget_views
        skipif:
          conditions:
            - never
        partial:
          widgets: ${{ workflow.trends_main_widget.return }}

  # ── 6b grid maps ──────────────────────────────────────────────────────────────

  - title: Grid Map
    type: task-group
    description: Where each value is concentrated, counted in grid squares.
    tasks:
      - id: grid
        task: set_categorical_grid
        partial:
          df: ${{ workflow.events_temporal_index.return }}

      - id: grid_maps
        task: draw_categorical_grid_maps
        partial:
          catalogue: ${{ workflow.catalogue.return }}
          ranking: ${{ workflow.ranking.return }}
          cell_km: ${{ workflow.grid.return }}
          tile_layers: ${{ workflow.base_maps.return }}
        mapvalues:
          argnames: df
          argvalues: ${{ workflow.events_split.return }}

      - id: grid_maps_html
        task: persist_text
        partial:
          root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
          filename_suffix: grid_maps
        mapvalues:
          argnames: text
          argvalues: ${{ workflow.grid_maps.return }}

      - id: grid_maps_title
        task: categorical_widget_title
        # no events: the grid size is skipped; the title goes without it
        skipif:
          conditions:
            - never
        partial:
          catalogue: ${{ workflow.catalogue.return }}
          cell_km: ${{ workflow.grid.return }}
          template: "{main} density ({km} km squares)"

      - id: grid_maps_widget
        task: create_map_widget_single_view
        skipif:
          conditions:
            - never
        partial:
          title: ${{ workflow.grid_maps_title.return }}
        map:
          argnames: [view, data]
          argvalues: ${{ workflow.grid_maps_html.return }}

      - id: grid_maps_merged
        task: merge_widget_views
        skipif:
          conditions:
            - never
        partial:
          widgets: ${{ workflow.grid_maps_widget.return }}

  # ── 1 headline tiles: one widget each, a number and a sparkline ──────────────────

  - id: kpi_events_title
    task: categorical_widget_title
    partial:
      catalogue: ${{ workflow.catalogue.return }}
      template: "{Measure}"  # Events (or Detections), or "Total <Count Field>" when one is set

  - id: kpi_distinct_title
    task: categorical_widget_title
    partial:
      catalogue: ${{ workflow.catalogue.return }}
      template: "Distinct {main} values"

  - id: kpi_blank_title
    task: categorical_widget_title
    partial:
      catalogue: ${{ workflow.catalogue.return }}
      template: "Unassigned {main}"

  - id: kpi_events
    task: draw_categorical_kpi
    partial:
      catalogue: ${{ workflow.catalogue.return }}
      kpi: events
      period: ${{ workflow.trend_period.return }}
      time_range: ${{ workflow.time_range.return }}
    mapvalues:
      argnames: df
      argvalues: ${{ workflow.events_split.return }}

  - id: kpi_events_html
    task: persist_text
    partial:
      root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
      filename_suffix: kpi_events
    mapvalues:
      argnames: text
      argvalues: ${{ workflow.kpi_events.return }}

  - id: kpi_events_widget
    task: create_plot_widget_single_view
    skipif:
      conditions:
        - never
    partial:
      title: ${{ workflow.kpi_events_title.return }}
    map:
      argnames: [view, data]
      argvalues: ${{ workflow.kpi_events_html.return }}

  - id: kpi_events_merged
    task: merge_widget_views
    skipif:
      conditions:
        - never
    partial:
      widgets: ${{ workflow.kpi_events_widget.return }}

  - id: kpi_distinct
    task: draw_categorical_kpi
    partial:
      catalogue: ${{ workflow.catalogue.return }}
      kpi: distinct
      period: ${{ workflow.trend_period.return }}
      time_range: ${{ workflow.time_range.return }}
    mapvalues:
      argnames: df
      argvalues: ${{ workflow.events_split.return }}

  - id: kpi_distinct_html
    task: persist_text
    partial:
      root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
      filename_suffix: kpi_distinct
    mapvalues:
      argnames: text
      argvalues: ${{ workflow.kpi_distinct.return }}

  - id: kpi_distinct_widget
    task: create_plot_widget_single_view
    skipif:
      conditions:
        - never
    partial:
      title: ${{ workflow.kpi_distinct_title.return }}
    map:
      argnames: [view, data]
      argvalues: ${{ workflow.kpi_distinct_html.return }}

  - id: kpi_distinct_merged
    task: merge_widget_views
    skipif:
      conditions:
        - never
    partial:
      widgets: ${{ workflow.kpi_distinct_widget.return }}

  - id: kpi_blank
    task: draw_categorical_kpi
    partial:
      catalogue: ${{ workflow.catalogue.return }}
      kpi: blank
      period: ${{ workflow.trend_period.return }}
      time_range: ${{ workflow.time_range.return }}
    mapvalues:
      argnames: df
      argvalues: ${{ workflow.events_split.return }}

  - id: kpi_blank_html
    task: persist_text
    partial:
      root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
      filename_suffix: kpi_blank
    mapvalues:
      argnames: text
      argvalues: ${{ workflow.kpi_blank.return }}

  - id: kpi_blank_widget
    task: create_plot_widget_single_view
    skipif:
      conditions:
        - never
    partial:
      title: ${{ workflow.kpi_blank_title.return }}
    map:
      argnames: [view, data]
      argvalues: ${{ workflow.kpi_blank_html.return }}

  - id: kpi_blank_merged
    task: merge_widget_views
    skipif:
      conditions:
        - never
    partial:
      widgets: ${{ workflow.kpi_blank_widget.return }}

  # ── 2 sunburst ────────────────────────────────────────────────────────────────

  - id: sunburst
    task: draw_categorical_sunburst
    partial:
      catalogue: ${{ workflow.catalogue.return }}
      ranking: ${{ workflow.ranking.return }}
    mapvalues:
      argnames: df
      argvalues: ${{ workflow.events_split.return }}

  - id: sunburst_html
    task: persist_text
    partial:
      root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
      filename_suffix: sunburst
    mapvalues:
      argnames: text
      argvalues: ${{ workflow.sunburst.return }}

  - id: sunburst_widget
    task: create_plot_widget_single_view
    skipif:
      conditions:
        - never
    partial:
      title: Breakdown
    map:
      argnames: [view, data]
      argvalues: ${{ workflow.sunburst_html.return }}

  - id: sunburst_merged
    task: merge_widget_views
    skipif:
      conditions:
        - never
    partial:
      widgets: ${{ workflow.sunburst_widget.return }}

  # ── 3 bars ──────────────────────────────────────────────────────────────────────

  - id: main_values_title
    task: categorical_widget_title
    partial:
      catalogue: ${{ workflow.catalogue.return }}
      template: "{main}"

  - id: bars_main
    task: draw_categorical_bars
    partial:
        catalogue: ${{ workflow.catalogue.return }}
        ranking: ${{ workflow.ranking.return }}
        which: main
    mapvalues:
      argnames: df
      argvalues: ${{ workflow.events_split.return }}

  - id: bars_main_html
    task: persist_text
    partial:
      root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
      filename_suffix: main_field_values
    mapvalues:
      argnames: text
      argvalues: ${{ workflow.bars_main.return }}

  - id: bars_main_widget
    task: create_plot_widget_single_view
    skipif:
      conditions:
        - never
    partial:
      title: ${{ workflow.main_values_title.return }}
    map:
      argnames: [view, data]
      argvalues: ${{ workflow.bars_main_html.return }}

  - id: bars_main_merged
    task: merge_widget_views
    skipif:
      conditions:
        - never
    partial:
      widgets: ${{ workflow.bars_main_widget.return }}

  # each other field: its own values and over-time widgets (one view per group); they go
  # last in the widget list, so their number can follow the fields picked (layout.json
  # has slots for 8, unused slots are dropped)
  # ── 6 maps ────────────────────────────────────────────────────────────────────

  - id: points_map
    task: draw_categorical_points_map
    partial:
      catalogue: ${{ workflow.catalogue.return }}
      ranking: ${{ workflow.ranking.return }}
      tile_layers: ${{ workflow.base_maps.return }}
    mapvalues:
      argnames: df
      argvalues: ${{ workflow.events_split.return }}

  - id: points_map_html
    task: persist_text
    partial:
      root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
      filename_suffix: points_map
    mapvalues:
      argnames: text
      argvalues: ${{ workflow.points_map.return }}

  - id: points_map_title
    task: categorical_widget_title
    partial:
      catalogue: ${{ workflow.catalogue.return }}
      template: "{main} by location"

  - id: points_map_widget
    task: create_map_widget_single_view
    skipif:
      conditions:
        - never
    partial:
      title: ${{ workflow.points_map_title.return }}
    map:
      argnames: [view, data]
      argvalues: ${{ workflow.points_map_html.return }}

  - id: points_map_merged
    task: merge_widget_views
    skipif:
      conditions:
        - never
    partial:
      widgets: ${{ workflow.points_map_widget.return }}

  # ── 7 tables and files ────────────────────────────────────────────────────────

  - id: summary_table
    task: categorical_summary_table
    partial:
      catalogue: ${{ workflow.catalogue.return }}
      cell_km: ${{ workflow.grid.return }}
    mapvalues:
      argnames: df
      argvalues: ${{ workflow.events_split.return }}

  - id: summary_table_drawn
    task: draw_table
    partial:
      columns: null
      table_config:
        enable_sorting: true
        enable_filtering: true
        enable_download: true
        hide_header: false
      widget_id: Values table
    mapvalues:
      argnames: dataframe
      argvalues: ${{ workflow.summary_table.return }}

  - id: summary_table_html
    task: persist_text
    partial:
      root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
      filename_suffix: values_table
    mapvalues:
      argnames: text
      argvalues: ${{ workflow.summary_table_drawn.return }}

  - id: summary_table_widget
    task: create_table_widget_single_view
    skipif:
      conditions:
        - never
    partial:
      title: Values table
    map:
      argnames: [view, data]
      argvalues: ${{ workflow.summary_table_html.return }}

  - id: summary_table_merged
    task: merge_widget_views
    skipif:
      conditions:
        - never
    partial:
      widgets: ${{ workflow.summary_table_widget.return }}

  - id: all_values_table
    task: categorical_summary_table
    partial:
      df: ${{ workflow.events_temporal_index.return }}
      catalogue: ${{ workflow.catalogue.return }}
      cell_km: ${{ workflow.grid.return }}

  - id: all_values_csv
    task: persist_df
    partial:
      df: ${{ workflow.all_values_table.return }}
      filetype: csv
      filename: values_summary
      root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}

  - id: events_table
    task: categorical_events_table
    partial:
      df: ${{ workflow.events_temporal_index.return }}
      catalogue: ${{ workflow.catalogue.return }}

  - id: events_csv
    task: persist_df
    partial:
      df: ${{ workflow.events_table.return }}
      filetype: csv
      filename: events
      root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}

  - id: values_file
    task: create_files_single_view
    # no events: an empty file list (its fallback), so the dashboard still shows
    skipif:
      conditions:
        - never
    partial:
      files: ${{ workflow.all_values_csv.return }}

  - id: events_file
    task: create_files_single_view
    # no events: an empty file list (its fallback), so the dashboard still shows
    skipif:
      conditions:
        - never
    partial:
      files: ${{ workflow.events_csv.return }}

  - name: Dashboard
    id: dashboard
    task: gather_dashboard
    partial:
      details: ${{ workflow.workflow_details.return }}
      widgets:
        - ${{ workflow.kpi_events_merged.return }}
        - ${{ workflow.kpi_distinct_merged.return }}
        - ${{ workflow.kpi_blank_merged.return }}
        - ${{ workflow.bars_main_merged.return }}
        - ${{ workflow.sunburst_merged.return }}
        - ${{ workflow.trends_main_merged.return }}
        - ${{ workflow.points_map_merged.return }}
        - ${{ workflow.grid_maps_merged.return }}
        - ${{ workflow.summary_table_merged.return }}
      groupers: ${{ workflow.groupers.return }}
      time_range: ${{ workflow.time_range.return }}
      files:
        - ${{ workflow.values_file.return }}
        - ${{ workflow.events_file.return }}
